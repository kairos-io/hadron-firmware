name: Build firmware images
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ci-firmware-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: cncf-ubuntu-32-128-x86
    permissions:
      packages: write
      contents: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Log in to the Container registry
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build firmware
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          ./firmware.sh --build --cache-from type=gha --cache-to "type=gha,mode=max"
      - name: Publish firmware on tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          ./firmware.sh --build --push --repository ghcr.io/${{ github.repository }} --firmware-version ${{ github.ref_name }} --cache-from type=gha --cache-to "type=gha,mode=max"
      - name: Build sysexts on tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          ./firmware.sh --repository ghcr.io/${{ github.repository }} --sysext
          mv build unsigned-sysext
      - name: Build sysexts
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        run: |
          ./firmware.sh --sysext
          mv build unsigned-sysext
      - name: Build signed sysext
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          ./firmware.sh --sysext --private-key .github/keys/PK.key --certificate .github/keys/PK.pem
          mv build signed-sysext
      - name: Upload sysext artifacts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-sysext
          path: unsigned-sysext/
      - name: Upload signed sysext artifacts
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
            name: signed-sysext
            path: signed-sysext/
      - name: Generate release notes and manifest on tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # Build the list of published images as a name -> image ref mapping.
          images_json="[]"
          if [[ -f published-images.txt ]]; then
            while IFS= read -r img; do
              [[ -z "$img" ]] && continue
              # name is the image name without the registry/owner prefix and without the tag
              name=$(basename "${img%%:*}")
              images_json=$(jq --arg n "$name" --arg l "$img" '. += [{($n): $l}]' <<< "$images_json")
            done < published-images.txt
          fi

          # Build the list of uploaded sysext files as a name -> release download link mapping.
          sysext_json="[]"
          if [[ -d unsigned-sysext ]]; then
            for f in unsigned-sysext/*; do
              [[ -f "$f" ]] || continue
              fname=$(basename "$f")
              sysext_json=$(jq --arg n "$fname" --arg l "${BASE_URL}/${fname}" '. += [{($n): $l}]' <<< "$sysext_json")
            done
          fi

          jq -n --argjson images "$images_json" --argjson sysext "$sysext_json" \
            '{images: $images, sysext: $sysext}' > release.json

          # Build the release notes with collapsible sections so they are not huge.
          {
            echo "## Firmware release ${TAG}"
            echo ""
            echo "<details>"
            echo "<summary>Published images</summary>"
            echo ""
            jq -r '.images[] | to_entries[] | "- `\(.value)`"' release.json
            echo ""
            echo "</details>"
            echo ""
            echo "<details>"
            echo "<summary>Sysext files</summary>"
            echo ""
            jq -r '.sysext[] | to_entries[] | "- [\(.key)](\(.value))"' release.json
            echo ""
            echo "</details>"
          } > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Release sysexts on tag
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: false
          files: |
            unsigned-sysext/*
            release.json
