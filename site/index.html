<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hadron Firmware Releases</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2129;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #2f81f7;
    --accent-2: #238636;
    --code: #c9d1d9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #11161d, var(--bg));
  }
  header h1 { margin: 0 0 6px; font-size: 1.6rem; }
  header p { margin: 0; color: var(--muted); }
  header a { color: var(--accent); text-decoration: none; }
  main { max-width: 1400px; margin: 0 auto; padding: 20px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    margin-bottom: 18px;
  }
  .controls label { color: var(--muted); font-size: .9rem; margin-right: 6px; }
  select, input[type="search"] {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: .95rem;
    min-width: 220px;
  }
  input[type="search"] { flex: 1; min-width: 200px; }
  .meta { color: var(--muted); font-size: .85rem; margin-bottom: 16px; }
  .meta .pill {
    display: inline-block;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    margin-right: 8px;
  }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  thead th {
    text-align: left;
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr.details-row td { border-bottom: 1px solid var(--border); padding: 0; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.component-row:hover { background: rgba(255,255,255,.02); }
  .component { font-weight: 600; white-space: nowrap; }
  .actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .ref {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: .82rem;
    color: var(--code);
    background: #0b0f14;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    word-break: break-all;
    flex: 1;
    min-width: 0;
  }
  .none { color: var(--muted); font-style: italic; }
  button.btn, a.btn {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: .8rem;
    text-decoration: none;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background .15s, border-color .15s;
  }
  button.btn:hover, a.btn:hover { background: #2a3038; border-color: var(--accent); }
  button.btn.copied { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
  button.btn:disabled { opacity: .4; cursor: not-allowed; }
  button.btn:disabled:hover { background: var(--panel-2); border-color: var(--border); }
  button.btn.docker { border-color: #1d63ed; }
  button.btn.docker:hover { border-color: #2f81f7; }
  button.btn .ico { width: 15px; height: 15px; flex: none; }
  button.btn.toggle .ico { transition: transform .15s; }
  button.btn.toggle[aria-expanded="true"] .ico { transform: rotate(90deg); }
  .details {
    padding: 14px 18px;
    background: #0b0f14;
    border-top: 1px solid var(--border);
  }
  .details .link-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .details .link-row:last-child { margin-bottom: 0; }
  .details .link-label {
    color: var(--muted);
    font-size: .78rem;
    min-width: 130px;
    flex: none;
  }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 30px 20px; }
</style>
</head>
<body>
<header>
  <h1>Hadron Firmware Releases</h1>
  <p id="subtitle">Browse published firmware components for each release.</p>
</header>
<main>
  <div class="controls">
    <div>
      <label for="tag">Release tag</label>
      <select id="tag" aria-label="Select a release tag"></select>
    </div>
    <input type="search" id="filter" placeholder="Filter components…" aria-label="Filter components" />
  </div>
  <div class="meta" id="meta"></div>
  <div id="table-wrap"></div>
</main>
<footer id="footer"></footer>

<script>
(function () {
  "use strict";

  var DATA = null;
  var current = null;

  function el(id) { return document.getElementById(id); }

  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  // Derive a component key from a sysext file name so it can be matched against
  // an image name. Sysext files are named "<image-name>_<tag>.<ext>" (see
  // firmware.sh), e.g. "linux-firmware-ath10k_20260622.raw".
  function componentFromSysext(fname, tag) {
    var base = fname;
    // strip a trailing extension chain like .raw / .raw.sig / .sysext.raw
    base = base.replace(/\.(raw|sig|verity|sysext)$/i, "");
    base = base.replace(/\.(raw|sig|verity|sysext)$/i, "");
    if (tag) {
      base = base.replace(new RegExp("_" + escapeRegExp(tag) + "$"), "");
    } else {
      base = base.replace(/_[0-9][0-9A-Za-z.\-]*$/, "");
    }
    return base;
  }

  // Build a merged list of components for a release, joining images and sysext
  // entries on the derived component key.
  function buildRows(release) {
    var map = {};
    var images = release.images || {};
    var sysext = release.sysext || {};

    Object.keys(images).forEach(function (name) {
      if (!map[name]) map[name] = { component: name, image: null, sysext: [] };
      map[name].image = images[name];
    });

    Object.keys(sysext).forEach(function (fname) {
      var key = componentFromSysext(fname, release.tag);
      if (!map[key]) map[key] = { component: key, image: null, sysext: [] };
      map[key].sysext.push({ name: fname, url: sysext[fname] });
    });

    return Object.keys(map).sort().map(function (k) { return map[k]; });
  }

  function svgIcon(paths, viewBox) {
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("class", "ico");
    svg.setAttribute("viewBox", viewBox || "0 0 16 16");
    svg.setAttribute("fill", "currentColor");
    svg.setAttribute("aria-hidden", "true");
    var p = document.createElementNS(ns, "path");
    p.setAttribute("d", paths);
    svg.appendChild(p);
    return svg;
  }

  function dockerIcon() {
    // Docker logo mark (Simple Icons), drawn on a 24x24 viewBox.
    return svgIcon(
      "M13.983 11.078h2.119a.186.186 0 00.186-.185V9.006a.186.186 0 00-.186-.186h-2.119a.185.185 0 00-.185.185v1.888c0 .102.083.185.185.185m-2.954-5.43h2.118a.186.186 0 00.186-.186V3.574a.186.186 0 00-.186-.185h-2.118a.185.185 0 00-.185.185v1.888c0 .102.082.185.185.185m0 2.716h2.118a.187.187 0 00.186-.186V6.29a.186.186 0 00-.186-.185h-2.118a.185.185 0 00-.185.185v1.887c0 .102.082.185.185.186m-2.93 0h2.12a.186.186 0 00.184-.186V6.29a.185.185 0 00-.185-.185H8.1a.185.185 0 00-.185.185v1.887c0 .102.083.185.185.186m-2.964 0h2.119a.186.186 0 00.185-.186V6.29a.185.185 0 00-.185-.185H5.136a.186.186 0 00-.186.185v1.887c0 .102.084.185.186.186m5.893 2.715h2.118a.186.186 0 00.186-.185V9.006a.186.186 0 00-.186-.186h-2.118a.185.185 0 00-.185.185v1.888c0 .102.082.185.185.185m-2.93 0h2.12a.185.185 0 00.184-.185V9.006a.185.185 0 00-.184-.186h-2.12a.185.185 0 00-.184.185v1.888c0 .102.083.185.185.185m-2.964 0h2.119a.185.185 0 00.185-.185V9.006a.185.185 0 00-.184-.186h-2.12a.186.186 0 00-.186.186v1.887c0 .102.084.185.186.185m-2.92 0h2.12a.185.185 0 00.184-.185V9.006a.185.185 0 00-.184-.186h-2.12a.185.185 0 00-.184.185v1.888c0 .102.082.185.185.185M23.763 9.89c-.065-.051-.672-.51-1.954-.51-.338.001-.676.03-1.01.087-.248-1.7-1.653-2.53-1.716-2.566l-.344-.199-.226.327c-.284.438-.49.922-.612 1.43-.23.97-.09 1.882.403 2.661-.595.332-1.55.413-1.744.42H.751a.751.751 0 00-.75.748 11.376 11.376 0 00.692 4.062c.545 1.428 1.355 2.48 2.41 3.124 1.18.723 3.1 1.137 5.275 1.137.983.003 1.963-.086 2.93-.266a12.248 12.248 0 003.823-1.389c.98-.567 1.86-1.288 2.61-2.136 1.252-1.418 1.998-2.997 2.553-4.4h.221c1.372 0 2.215-.549 2.68-1.009.309-.293.55-.65.707-1.046l.098-.288z",
      "0 0 24 24"
    );
  }

  function chevronIcon() {
    return svgIcon("M6 3.5L10.5 8L6 12.5L5 11.5L8.5 8L5 4.5z");
  }

  function copyIcon() {
    return svgIcon("M4 2h6a1 1 0 0 1 1 1v1h-1V3H4v7H3V3a1 1 0 0 1 1-1zm2 2h6a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm0 1v8h6V5H6z");
  }

  function downloadIcon() {
    return svgIcon("M7.5 1h1v6.8l2.1-2.1.7.7L8 9.4 4.7 6.4l.7-.7L7.5 7.8V1zM3 12h10v1H3v-1z");
  }

  // Build a button that copies `text` to the clipboard when clicked.
  function copyButton(label, text, extraClass, iconFn) {
    var btn = document.createElement("button");
    btn.className = "btn" + (extraClass ? " " + extraClass : "");
    btn.type = "button";
    if (iconFn) btn.appendChild(iconFn());
    var span = document.createElement("span");
    span.textContent = label;
    btn.appendChild(span);
    btn.addEventListener("click", function () {
      var done = function () {
        var prev = span.textContent;
        span.textContent = "Copied!";
        btn.classList.add("copied");
        setTimeout(function () {
          span.textContent = prev;
          btn.classList.remove("copied");
        }, 1200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
      } else {
        fallbackCopy(text, done);
      }
    });
    return btn;
  }

  function downloadButton(label, url) {
    var a = document.createElement("a");
    a.className = "btn";
    a.href = url;
    a.setAttribute("download", "");
    a.appendChild(downloadIcon());
    var span = document.createElement("span");
    span.textContent = label;
    a.appendChild(span);
    return a;
  }

  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { /* ignore */ }
    document.body.removeChild(ta);
  }

  // Pick the primary sysext entry (prefer the actual image over signatures).
  function primarySysext(entries) {
    if (!entries || !entries.length) return null;
    for (var i = 0; i < entries.length; i++) {
      if (!/\.(sig|verity)$/i.test(entries[i].name)) return entries[i];
    }
    return entries[0];
  }

  // A single labelled "code + copy" row used inside the expandable details panel.
  function linkRow(label, url) {
    var row = document.createElement("div");
    row.className = "link-row";
    var lab = document.createElement("span");
    lab.className = "link-label";
    lab.textContent = label;
    row.appendChild(lab);
    var code = document.createElement("code");
    code.textContent = url;
    row.appendChild(code);
    row.appendChild(copyButton("Copy", url, null, copyIcon));
    return row;
  }

  function render() {
    if (!current) return;
    var filter = el("filter").value.trim().toLowerCase();
    var rows = buildRows(current).filter(function (r) {
      return !filter || r.component.toLowerCase().indexOf(filter) !== -1;
    });

    var imageCount = Object.keys(current.images || {}).length;
    var sysextCount = Object.keys(current.sysext || {}).length;
    var meta = el("meta");
    meta.innerHTML = "";
    var pills = [
      rows.length + " component" + (rows.length === 1 ? "" : "s"),
      imageCount + " image" + (imageCount === 1 ? "" : "s"),
      sysextCount + " sysext file" + (sysextCount === 1 ? "" : "s")
    ];
    pills.forEach(function (p) {
      var span = document.createElement("span");
      span.className = "pill";
      span.textContent = p;
      meta.appendChild(span);
    });
    if (current.html_url) {
      var link = document.createElement("a");
      link.href = current.html_url;
      link.textContent = "View release on GitHub ↗";
      link.style.color = "var(--accent)";
      meta.appendChild(link);
    }

    var wrap = el("table-wrap");
    wrap.innerHTML = "";
    if (!rows.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No components match your filter.";
      wrap.appendChild(empty);
      return;
    }

    var table = document.createElement("table");
    var thead = document.createElement("thead");
    thead.innerHTML = "<tr><th>Component</th><th style=\"text-align:right\">Actions</th></tr>";
    table.appendChild(thead);
    var tbody = document.createElement("tbody");
    rows.forEach(function (r) {
      var sysext = primarySysext(r.sysext);

      var tr = document.createElement("tr");
      tr.className = "component-row";
      var tdName = document.createElement("td");
      tdName.className = "component";
      tdName.textContent = r.component;
      tr.appendChild(tdName);

      var tdActions = document.createElement("td");
      var actions = document.createElement("div");
      actions.className = "actions";

      var dockerBtn = copyButton("Copy Docker link", r.image || "", "docker", dockerIcon);
      if (!r.image) dockerBtn.disabled = true;
      actions.appendChild(dockerBtn);

      var copySysBtn = copyButton("Copy sysext link", sysext ? sysext.url : "", null, copyIcon);
      if (!sysext) copySysBtn.disabled = true;
      actions.appendChild(copySysBtn);

      if (sysext) {
        actions.appendChild(downloadButton("Download sysext", sysext.url));
      } else {
        var dlDisabled = document.createElement("button");
        dlDisabled.className = "btn";
        dlDisabled.type = "button";
        dlDisabled.disabled = true;
        dlDisabled.appendChild(downloadIcon());
        var dspan = document.createElement("span");
        dspan.textContent = "Download sysext";
        dlDisabled.appendChild(dspan);
        actions.appendChild(dlDisabled);
      }

      var toggle = document.createElement("button");
      toggle.className = "btn toggle";
      toggle.type = "button";
      toggle.setAttribute("aria-expanded", "false");
      toggle.appendChild(chevronIcon());
      var tlabel = document.createElement("span");
      tlabel.textContent = "See links";
      toggle.appendChild(tlabel);
      actions.appendChild(toggle);

      tdActions.appendChild(actions);
      tr.appendChild(tdActions);
      tbody.appendChild(tr);

      // Hidden details row with the full links.
      var detailsTr = document.createElement("tr");
      detailsTr.className = "details-row";
      detailsTr.style.display = "none";
      var detailsTd = document.createElement("td");
      detailsTd.colSpan = 2;
      var details = document.createElement("div");
      details.className = "details";
      if (r.image) {
        details.appendChild(linkRow("Docker image", r.image));
      }
      (r.sysext || []).forEach(function (e) {
        details.appendChild(linkRow(e.name, e.url));
      });
      if (!r.image && !(r.sysext && r.sysext.length)) {
        var none = document.createElement("span");
        none.className = "none";
        none.textContent = "No links available for this component.";
        details.appendChild(none);
      }
      detailsTd.appendChild(details);
      detailsTr.appendChild(detailsTd);
      tbody.appendChild(detailsTr);

      toggle.addEventListener("click", function () {
        var open = detailsTr.style.display === "none";
        detailsTr.style.display = open ? "" : "none";
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
        tlabel.textContent = open ? "Hide links" : "See links";
      });
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
  }

  function selectTag(tag) {
    current = DATA.releases.filter(function (r) { return r.tag === tag; })[0] || null;
    render();
  }

  function init(data) {
    DATA = data;
    var sel = el("tag");
    if (!data.releases || !data.releases.length) {
      el("table-wrap").innerHTML = '<div class="empty">No releases with a release.json were found yet.</div>';
      return;
    }
    data.releases.forEach(function (r) {
      var opt = document.createElement("option");
      opt.value = r.tag;
      opt.textContent = r.tag + (r.prerelease ? " (pre-release)" : "");
      sel.appendChild(opt);
    });
    sel.addEventListener("change", function () { selectTag(sel.value); });
    el("filter").addEventListener("input", render);

    if (data.repo) {
      el("subtitle").innerHTML =
        'Browse published firmware components for each release of ' +
        '<a href="https://github.com/' + data.repo + '">' + data.repo + '</a>.';
    }
    var footer = el("footer");
    if (data.generated) {
      footer.textContent = "Data generated " + data.generated;
    }

    selectTag(data.releases[0].tag);
  }

  fetch("data.json", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(init)
    .catch(function (err) {
      el("table-wrap").innerHTML =
        '<div class="empty">Could not load data.json: ' + String(err) + "</div>";
    });
})();
</script>
</body>
</html>
