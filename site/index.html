<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hadron Firmware Releases</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2129;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #2f81f7;
    --accent-2: #238636;
    --code: #c9d1d9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #11161d, var(--bg));
  }
  header h1 { margin: 0 0 6px; font-size: 1.6rem; }
  header p { margin: 0; color: var(--muted); }
  header a { color: var(--accent); text-decoration: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    margin-bottom: 18px;
  }
  .controls label { color: var(--muted); font-size: .9rem; margin-right: 6px; }
  select, input[type="search"] {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: .95rem;
    min-width: 220px;
  }
  input[type="search"] { flex: 1; min-width: 200px; }
  .meta { color: var(--muted); font-size: .85rem; margin-bottom: 16px; }
  .meta .pill {
    display: inline-block;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    margin-right: 8px;
  }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  thead th {
    text-align: left;
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,.02); }
  .component { font-weight: 600; }
  .ref {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: .82rem;
    color: var(--code);
    background: #0b0f14;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    word-break: break-all;
    max-width: 520px;
  }
  .none { color: var(--muted); font-style: italic; }
  button.copy, a.dl {
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: .8rem;
    text-decoration: none;
    white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  button.copy:hover, a.dl:hover { background: #2a3038; border-color: var(--accent); }
  button.copy.copied { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 30px 20px; }
</style>
</head>
<body>
<header>
  <h1>Hadron Firmware Releases</h1>
  <p id="subtitle">Browse published firmware components for each release.</p>
</header>
<main>
  <div class="controls">
    <div>
      <label for="tag">Release tag</label>
      <select id="tag" aria-label="Select a release tag"></select>
    </div>
    <input type="search" id="filter" placeholder="Filter components…" aria-label="Filter components" />
  </div>
  <div class="meta" id="meta"></div>
  <div id="table-wrap"></div>
</main>
<footer id="footer"></footer>

<script>
(function () {
  "use strict";

  var DATA = null;
  var current = null;

  function el(id) { return document.getElementById(id); }

  function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  // Derive a component key from a sysext file name so it can be matched against
  // an image name. Sysext files are named "<image-name>_<tag>.<ext>" (see
  // firmware.sh), e.g. "linux-firmware-ath10k_20260622.raw".
  function componentFromSysext(fname, tag) {
    var base = fname;
    // strip a trailing extension chain like .raw / .raw.sig / .sysext.raw
    base = base.replace(/\.(raw|sig|verity|sysext)$/i, "");
    base = base.replace(/\.(raw|sig|verity|sysext)$/i, "");
    if (tag) {
      base = base.replace(new RegExp("_" + escapeRegExp(tag) + "$"), "");
    } else {
      base = base.replace(/_[0-9][0-9A-Za-z.\-]*$/, "");
    }
    return base;
  }

  // Build a merged list of components for a release, joining images and sysext
  // entries on the derived component key.
  function buildRows(release) {
    var map = {};
    var images = release.images || {};
    var sysext = release.sysext || {};

    Object.keys(images).forEach(function (name) {
      if (!map[name]) map[name] = { component: name, image: null, sysext: [] };
      map[name].image = images[name];
    });

    Object.keys(sysext).forEach(function (fname) {
      var key = componentFromSysext(fname, release.tag);
      if (!map[key]) map[key] = { component: key, image: null, sysext: [] };
      map[key].sysext.push({ name: fname, url: sysext[fname] });
    });

    return Object.keys(map).sort().map(function (k) { return map[k]; });
  }

  function copyButton(text) {
    var btn = document.createElement("button");
    btn.className = "copy";
    btn.type = "button";
    btn.textContent = "Copy";
    btn.addEventListener("click", function () {
      var done = function () {
        btn.textContent = "Copied!";
        btn.classList.add("copied");
        setTimeout(function () {
          btn.textContent = "Copy";
          btn.classList.remove("copied");
        }, 1200);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
      } else {
        fallbackCopy(text, done);
      }
    });
    return btn;
  }

  function fallbackCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { /* ignore */ }
    document.body.removeChild(ta);
  }

  function cellRef(text) {
    var wrap = document.createElement("div");
    wrap.className = "ref";
    if (!text) {
      var none = document.createElement("span");
      none.className = "none";
      none.textContent = "—";
      wrap.appendChild(none);
      return wrap;
    }
    var code = document.createElement("code");
    code.textContent = text;
    wrap.appendChild(code);
    wrap.appendChild(copyButton(text));
    return wrap;
  }

  function cellSysext(entries) {
    var wrap = document.createElement("div");
    if (!entries || !entries.length) {
      var none = document.createElement("span");
      none.className = "none";
      none.textContent = "—";
      wrap.appendChild(none);
      return wrap;
    }
    entries.forEach(function (e) {
      var row = document.createElement("div");
      row.className = "ref";
      row.style.marginBottom = "6px";
      var code = document.createElement("code");
      code.textContent = e.url;
      row.appendChild(code);
      row.appendChild(copyButton(e.url));
      var dl = document.createElement("a");
      dl.className = "dl";
      dl.href = e.url;
      dl.textContent = "Download";
      dl.setAttribute("download", "");
      row.appendChild(dl);
      wrap.appendChild(row);
    });
    return wrap;
  }

  function render() {
    if (!current) return;
    var filter = el("filter").value.trim().toLowerCase();
    var rows = buildRows(current).filter(function (r) {
      return !filter || r.component.toLowerCase().indexOf(filter) !== -1;
    });

    var imageCount = Object.keys(current.images || {}).length;
    var sysextCount = Object.keys(current.sysext || {}).length;
    var meta = el("meta");
    meta.innerHTML = "";
    var pills = [
      rows.length + " component" + (rows.length === 1 ? "" : "s"),
      imageCount + " image" + (imageCount === 1 ? "" : "s"),
      sysextCount + " sysext file" + (sysextCount === 1 ? "" : "s")
    ];
    pills.forEach(function (p) {
      var span = document.createElement("span");
      span.className = "pill";
      span.textContent = p;
      meta.appendChild(span);
    });
    if (current.html_url) {
      var link = document.createElement("a");
      link.href = current.html_url;
      link.textContent = "View release on GitHub ↗";
      link.style.color = "var(--accent)";
      meta.appendChild(link);
    }

    var wrap = el("table-wrap");
    wrap.innerHTML = "";
    if (!rows.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No components match your filter.";
      wrap.appendChild(empty);
      return;
    }

    var table = document.createElement("table");
    var thead = document.createElement("thead");
    thead.innerHTML = "<tr><th>Component</th><th>Docker image</th><th>Sysext</th></tr>";
    table.appendChild(thead);
    var tbody = document.createElement("tbody");
    rows.forEach(function (r) {
      var tr = document.createElement("tr");
      var tdName = document.createElement("td");
      tdName.className = "component";
      tdName.textContent = r.component;
      tr.appendChild(tdName);
      var tdImg = document.createElement("td");
      tdImg.appendChild(cellRef(r.image));
      tr.appendChild(tdImg);
      var tdSys = document.createElement("td");
      tdSys.appendChild(cellSysext(r.sysext));
      tr.appendChild(tdSys);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
  }

  function selectTag(tag) {
    current = DATA.releases.filter(function (r) { return r.tag === tag; })[0] || null;
    render();
  }

  function init(data) {
    DATA = data;
    var sel = el("tag");
    if (!data.releases || !data.releases.length) {
      el("table-wrap").innerHTML = '<div class="empty">No releases with a release.json were found yet.</div>';
      return;
    }
    data.releases.forEach(function (r) {
      var opt = document.createElement("option");
      opt.value = r.tag;
      opt.textContent = r.tag + (r.prerelease ? " (pre-release)" : "");
      sel.appendChild(opt);
    });
    sel.addEventListener("change", function () { selectTag(sel.value); });
    el("filter").addEventListener("input", render);

    if (data.repo) {
      el("subtitle").innerHTML =
        'Browse published firmware components for each release of ' +
        '<a href="https://github.com/' + data.repo + '">' + data.repo + '</a>.';
    }
    var footer = el("footer");
    if (data.generated) {
      footer.textContent = "Data generated " + data.generated;
    }

    selectTag(data.releases[0].tag);
  }

  fetch("data.json", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(init)
    .catch(function (err) {
      el("table-wrap").innerHTML =
        '<div class="empty">Could not load data.json: ' + String(err) + "</div>";
    });
})();
</script>
</body>
</html>
